spring.application.name=tasktracker

# H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# JWT (override via env: APP_JWT_SECRET)
app.jwt.secret=change-this-to-a-long-random-secret-key-for-dev
app.jwt.expiration-ms=3600000
